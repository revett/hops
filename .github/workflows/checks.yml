name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run Biome
        run: bunx biome ci .
      - name: Run TypeScript
        run: bun run typecheck
